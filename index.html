<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器中调整 PDF 页面顺序、方向和页数。">
  <title>PDF 页面调整</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #20242b; background: #f5f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { background: #fff; border-bottom: 1px solid #e5e7eb; }
    .bar, main { width: min(1040px, calc(100% - 32px)); margin: auto; }
    .bar { min-height: 64px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .logo { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; color: white; background: #315efb; }
    main { padding: 42px 0 64px; }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 34px); }
    .intro { margin: 0 0 26px; color: #69707c; }
    .panel { padding: 24px; background: white; border: 1px solid #e5e7eb; border-radius: 14px; box-shadow: 0 4px 18px #18223008; }
    .drop { min-height: 190px; display: grid; place-items: center; border: 2px dashed #cdd3df; border-radius: 12px; background: #fafbfc; text-align: center; padding: 24px; }
    .drop.drag { border-color: #315efb; background: #f3f6ff; }
    .drop p { margin: 0 0 14px; color: #69707c; }
    button, .pick { border: 0; border-radius: 8px; padding: 10px 15px; background: #315efb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover, .pick:hover { background: #244bd1; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .pick input { display: none; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin: 20px 0; }
    .toolbar .secondary, .page-actions button { color: #293142; background: #eef1f5; }
    .toolbar .secondary:hover, .page-actions button:hover { background: #e1e6ee; }
    .filename { color: #69707c; margin-right: auto; overflow-wrap: anywhere; }
    .pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
    .page { min-width: 0; padding: 12px; border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; }
    .preview { height: 220px; display: grid; place-items: center; overflow: hidden; background: #f3f4f6; border-radius: 6px; }
    canvas { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 2px 8px #0002; background: #fff; }
    .page-info { display: flex; justify-content: space-between; gap: 8px; margin: 10px 0; font-size: 14px; font-weight: 600; }
    .page-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .page-actions button { padding: 7px 9px; font-size: 13px; }
    .page-actions .remove { color: #a12d35; background: #fff0f0; }
    .page-actions .remove:hover { background: #ffe2e2; }
    .status { min-height: 24px; margin-top: 14px; color: #596273; font-size: 14px; }
    .status.error { color: #b42318; }
    .empty { display: none; padding: 30px; color: #69707c; text-align: center; }
    .footnote { margin: 18px 2px 0; color: #7a8290; font-size: 13px; }
    .question-section { margin-top: 42px; }
    .question-section h2 { margin: 0 0 8px; font-size: 24px; }
    .question-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin: 18px 0; }
    .question-controls .secondary, .question-card button, .saved-row button { color: #293142; background: #eef1f5; }
    .question-controls .secondary:hover, .question-card button:hover, .saved-row button:hover { background: #e1e6ee; }
    .question-status { min-height: 24px; color: #596273; font-size: 14px; }
    .question-status.error { color: #b42318; }
    .question-preview-wrap { position: relative; display: inline-block; max-width: 100%; margin: 10px auto 18px; line-height: 0; touch-action: none; }
    .question-preview-wrap canvas { display: block; max-width: 100%; height: auto; }
    #qoverlay { position: absolute; inset: 0; cursor: crosshair; }
    #qselection { position: absolute; display: none; border: 2px solid #315efb; background: #315efb33; pointer-events: none; }
    .question-workspace { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
    .question-page { overflow: auto; text-align: center; min-height: 200px; background: #f3f4f6; border-radius: 10px; padding: 16px; }
    .question-list { display: grid; gap: 10px; }
    .question-card, .saved-row { padding: 10px; border: 1px solid #e5e7eb; border-radius: 9px; background: #fff; }
    .question-card img { display: block; max-width: 100%; max-height: 210px; margin: 0 auto 8px; object-fit: contain; }
    .question-card p { margin: 4px 0 8px; color: #69707c; font-size: 13px; }
    .question-card button, .saved-row button { padding: 6px 8px; font-size: 12px; margin: 0 4px 0 0; }
    .saved-list { display: grid; gap: 8px; margin-top: 10px; }
    .saved-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .saved-row small { color: #69707c; display: block; margin-top: 3px; }
    @media (max-width: 600px) { main { padding-top: 28px; } .panel { padding: 16px; } .toolbar { align-items: stretch; } .filename { width: 100%; } .pages { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .page { padding: 8px; } .preview { height: 170px; } }
    @media (max-width: 760px) { .question-workspace { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><div class="bar"><span class="logo">PDF</span><span>简易 PDF 工具</span></div></header>
  <main>
    <h1>调整 PDF 页面</h1>
    <p class="intro">旋转、删除或重新排列页面，完成后下载调整好的 PDF。</p>
    <section class="panel">
      <div class="drop" id="dropzone">
        <div><p>将 PDF 文件拖到这里，或从设备中选择</p><label class="pick">选择 PDF 文件<input id="file" type="file" accept="application/pdf,.pdf"></label></div>
      </div>
      <div class="toolbar" id="toolbar" hidden>
        <span class="filename" id="filename"></span>
        <button class="secondary" id="reset">重新选择</button>
        <button id="save">保存并下载 PDF</button>
      </div>
      <div class="pages" id="pages"></div>
      <div class="empty" id="empty">所有页面都已删除。请重新选择文件。</div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
    <p class="footnote">文件只在当前浏览器中处理，不会上传到服务器。</p>

    <section class="question-section">
      <h2>题目整理</h2>
      <p class="intro">在 PDF 页面上拖动鼠标框选题目，再调整顺序或保存到本机题库。</p>
      <section class="panel">
        <label class="pick">选择题目 PDF<input id="qfile" type="file" accept="application/pdf,.pdf"></label>
        <span id="qfilename" class="filename" style="margin-left:10px"></span>
        <div class="question-controls" id="qcontrols" hidden>
          <button class="secondary" id="qprev">上一页</button><span id="qpageinfo"></span><button class="secondary" id="qnext">下一页</button>
          <button class="secondary" id="qclear">清空已选</button>
          <button id="qadd">添加选框中的题目</button>
          <button class="secondary" id="qsave">保存到本机题库</button>
          <button class="secondary" id="qexport">下载编排后的 PDF</button>
        </div>
        <div id="qstatus" class="question-status" role="status" aria-live="polite">选择 PDF 后，在页面上拖动鼠标框选一题。</div>
        <div class="question-workspace">
          <div class="question-page" id="qpage"><div id="qwrap" class="question-preview-wrap" hidden><canvas id="qcanvas"></canvas><div id="qoverlay"><div id="qselection"></div></div></div></div>
          <div><strong>已选题目 <span id="qcount">0</span></strong><div id="qlist" class="question-list" style="margin-top:10px"></div></div>
        </div>
        <hr style="border:0;border-top:1px solid #e5e7eb;margin:22px 0">
        <strong>本机题库</strong><div id="qdb-list" class="saved-list"></div>
        <p class="footnote">PDF 页面和题目只在当前浏览器中处理；题库保存在当前浏览器的本机数据库中，换浏览器或清除浏览数据后不会自动同步。</p>
      </section>
    </section>
  </main>
  <script>
    (() => {
      const { PDFDocument, degrees } = PDFLib;
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const $ = id => document.getElementById(id);
      const fileInput = $('file'), zone = $('dropzone'), pagesEl = $('pages'), status = $('status');
      let sourceBytes = null, sourceName = '', pages = [], busy = false;
      function message(text, error = false) { status.textContent = text; status.classList.toggle('error', error); }
      function updateEmpty() { $('empty').style.display = sourceBytes && pages.length === 0 ? 'block' : 'none'; }
      function swap(i, j) { if (j < 0 || j >= pages.length) return; [pages[i], pages[j]] = [pages[j], pages[i]]; renderList(); }
      function renderList() {
        pagesEl.replaceChildren();
        pages.forEach((page, index) => {
          const card = document.createElement('article'); card.className = 'page';
          const preview = document.createElement('div'); preview.className = 'preview';
          const canvas = document.createElement('canvas'); canvas.setAttribute('aria-label', `第 ${index + 1} 页预览`); preview.append(canvas);
          const info = document.createElement('div'); info.className = 'page-info';
          const label = document.createElement('span'); label.textContent = `第 ${index + 1} 页`;
          const origin = document.createElement('span'); origin.textContent = `原第 ${page.index + 1} 页`; origin.style.color = '#7a8290';
          info.append(label, origin);
          const actions = document.createElement('div'); actions.className = 'page-actions';
          const add = (text, title, fn, cls = '') => { const b = document.createElement('button'); b.textContent = text; b.title = title; b.setAttribute('aria-label', title); if (cls) b.className = cls; b.onclick = fn; actions.append(b); };
          add('左转', '向左旋转 90 度', () => { page.rotation = (page.rotation + 270) % 360; renderList(); });
          add('右转', '向右旋转 90 度', () => { page.rotation = (page.rotation + 90) % 360; renderList(); });
          add('上移', '向前移动一页', () => swap(index, index - 1));
          add('下移', '向后移动一页', () => swap(index, index + 1));
          add('删除', '删除此页', () => { pages.splice(index, 1); renderList(); updateEmpty(); message(`已删除页面。当前剩余 ${pages.length} 页。`); }, 'remove');
          card.append(preview, info, actions); pagesEl.append(card);
          page.render(canvas, preview.clientWidth || 170).catch(() => {});
        });
        updateEmpty();
      }
      async function load(file) {
        if (!file || file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) { message('请选择有效的 PDF 文件。', true); return; }
        try {
          busy = true; message('正在读取并生成页面预览…');
          sourceBytes = await file.arrayBuffer(); sourceName = file.name;
          const doc = await pdfjsLib.getDocument({ data: sourceBytes.slice(0) }).promise;
          pages = [];
          for (let i = 1; i <= doc.numPages; i++) {
            const pdfPage = await doc.getPage(i);
            pages.push({ index: i - 1, rotation: 0, render: async (canvas, maxWidth) => {
              const rotation = (pdfPage.rotate + pages.find(p => p.index === i - 1).rotation + 360) % 360;
              const viewport = pdfPage.getViewport({ scale: 1, rotation });
              const scale = Math.min(maxWidth / viewport.width, 210 / viewport.height, 1.4);
              const scaled = pdfPage.getViewport({ scale, rotation });
              canvas.width = Math.ceil(scaled.width * devicePixelRatio); canvas.height = Math.ceil(scaled.height * devicePixelRatio);
              canvas.style.width = `${Math.ceil(scaled.width)}px`; canvas.style.height = `${Math.ceil(scaled.height)}px`;
              await pdfPage.render({ canvasContext: canvas.getContext('2d'), viewport: scaled, transform: devicePixelRatio === 1 ? null : [devicePixelRatio, 0, 0, devicePixelRatio, 0, 0] }).promise;
            }});
          }
          $('filename').textContent = `${file.name} · ${doc.numPages} 页`;
          zone.hidden = true; $('toolbar').hidden = false; renderList(); message('预览已就绪。使用页面按钮调整顺序、方向或删除页面。');
        } catch (e) { sourceBytes = null; pages = []; message('无法读取这个 PDF。请确认文件未损坏且未受密码保护。', true); console.error(e); }
        finally { busy = false; }
      }
      fileInput.addEventListener('change', e => load(e.target.files[0]));
      for (const event of ['dragenter', 'dragover']) zone.addEventListener(event, e => { e.preventDefault(); zone.classList.add('drag'); });
      for (const event of ['dragleave', 'drop']) zone.addEventListener(event, e => { e.preventDefault(); zone.classList.remove('drag'); });
      zone.addEventListener('drop', e => load(e.dataTransfer.files[0]));
      $('reset').onclick = () => { sourceBytes = null; sourceName = ''; pages = []; fileInput.value = ''; pagesEl.replaceChildren(); zone.hidden = false; $('toolbar').hidden = true; message(''); updateEmpty(); };
      $('save').onclick = async () => {
        if (busy || !sourceBytes || pages.length === 0) return;
        try {
          busy = true; $('save').disabled = true; message('正在生成 PDF…');
          const original = await PDFDocument.load(sourceBytes);
          const output = await PDFDocument.create();
          const copied = await output.copyPages(original, pages.map(p => p.index));
          copied.forEach((p, i) => { p.setRotation(degrees((p.getRotation().angle + pages[i].rotation + 360) % 360)); output.addPage(p); });
          const bytes = await output.save();
          const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
          const a = document.createElement('a'); a.href = url; a.download = sourceName.replace(/\.pdf$/i, '') + '-已调整.pdf'; a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000); message('已生成并下载调整后的 PDF。');
        } catch (e) { message('保存失败。文件可能受密码保护或包含不受支持的内容。', true); console.error(e); }
        finally { busy = false; $('save').disabled = false; }
      };
    })();
  </script>
  <script>
    (() => {
      const { PDFDocument, degrees } = PDFLib;
      const $ = id => document.getElementById(id);
      const status = $('qstatus'), overlay = $('qoverlay'), selection = $('qselection'), canvas = $('qcanvas');
      const dbName = 'brult-question-bank';
      let pdfDoc = null, pdfBytes = null, fileName = '', pageNo = 1, items = [], dragStart = null, currentRect = null, db = null;
      const say = (text, error = false) => { status.textContent = text; status.classList.toggle('error', error); };
      function openDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(dbName, 1);
          request.onupgradeneeded = () => request.result.createObjectStore('collections', { keyPath: 'id' });
          request.onsuccess = () => { db = request.result; resolve(db); };
          request.onerror = () => reject(request.error);
        });
      }
      function transaction(mode = 'readonly') { return db.transaction('collections', mode).objectStore('collections'); }
      async function refreshSaved() {
        const rows = await new Promise((resolve, reject) => { const req = transaction().getAll(); req.onsuccess = () => resolve(req.result || []); req.onerror = () => reject(req.error); });
        const list = $('qdb-list'); list.replaceChildren();
        rows.sort((a, b) => b.savedAt - a.savedAt).forEach(row => {
          const item = document.createElement('div'); item.className = 'saved-row';
          const info = document.createElement('div'); info.textContent = row.name;
          const small = document.createElement('small'); small.textContent = `${row.items.length} 道题 · ${new Date(row.savedAt).toLocaleString()}`; info.append(small);
          const load = document.createElement('button'); load.textContent = '载入'; load.onclick = () => { items = row.items; renderItems(); say(`已载入“${row.name}”。`); };
          item.append(info, load); list.append(item);
        });
        if (!rows.length) list.textContent = '还没有保存的题目集。';
      }
      function renderItems() {
        const list = $('qlist'); list.replaceChildren(); $('qcount').textContent = String(items.length);
        items.forEach((q, i) => {
          const card = document.createElement('article'); card.className = 'question-card';
          const img = document.createElement('img'); img.src = q.image; img.alt = `题目 ${i + 1}`;
          const caption = document.createElement('p'); caption.textContent = `题目 ${i + 1} · 第 ${q.page} 页`;
          const actions = document.createElement('div');
          const button = (label, action) => { const b = document.createElement('button'); b.textContent = label; b.onclick = action; actions.append(b); };
          button('上移', () => move(i, i - 1)); button('下移', () => move(i, i + 1));
          button('移除', () => { items.splice(i, 1); renderItems(); say('已从当前编排中移除。'); });
          card.append(img, caption, actions); list.append(card);
        });
      }
      function move(i, j) { if (j < 0 || j >= items.length) return; [items[i], items[j]] = [items[j], items[i]]; renderItems(); }
      async function renderPage() {
        const page = await pdfDoc.getPage(pageNo), natural = page.getViewport({ scale: 1 });
        const availableWidth = Math.max(240, $('qpage').clientWidth - 32);
        const scale = Math.min(availableWidth / natural.width, 1100 / natural.height, 1.6), viewport = page.getViewport({ scale });
        canvas.width = Math.ceil(viewport.width); canvas.height = Math.ceil(viewport.height);
        canvas.style.width = `${canvas.width}px`; canvas.style.height = `${canvas.height}px`;
        overlay.style.width = `${canvas.width}px`; overlay.style.height = `${canvas.height}px`;
        selection.style.display = 'none'; currentRect = null;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        $('qpageinfo').textContent = `第 ${pageNo} / ${pdfDoc.numPages} 页`;
        $('qprev').disabled = pageNo <= 1; $('qnext').disabled = pageNo >= pdfDoc.numPages;
      }
      $('qfile').addEventListener('change', async e => {
        const file = e.target.files[0]; if (!file) return;
        try {
          say('正在打开 PDF…'); fileName = file.name; pdfBytes = await file.arrayBuffer();
          pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise; pageNo = 1;
          $('qfilename').textContent = fileName; $('qcontrols').hidden = false; $('qwrap').hidden = false;
          await renderPage(); say('拖动鼠标框选一道题，然后点击“添加选框中的题目”。');
        } catch (err) { say('无法读取 PDF。文件可能损坏或受密码保护。', true); console.error(err); }
      });
      $('qprev').onclick = async () => { if (pageNo > 1) { pageNo--; await renderPage(); } };
      $('qnext').onclick = async () => { if (pageNo < pdfDoc.numPages) { pageNo++; await renderPage(); } };
      overlay.addEventListener('pointerdown', e => { const r = overlay.getBoundingClientRect(); dragStart = { x: e.clientX - r.left, y: e.clientY - r.top }; selection.style.left = `${dragStart.x}px`; selection.style.top = `${dragStart.y}px`; selection.style.width = '0'; selection.style.height = '0'; selection.style.display = 'block'; overlay.setPointerCapture(e.pointerId); });
      overlay.addEventListener('pointermove', e => { if (!dragStart) return; const r = overlay.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; currentRect = { x: Math.min(x, dragStart.x), y: Math.min(y, dragStart.y), w: Math.abs(x - dragStart.x), h: Math.abs(y - dragStart.y) }; Object.assign(selection.style, { left: `${currentRect.x}px`, top: `${currentRect.y}px`, width: `${currentRect.w}px`, height: `${currentRect.h}px` }); });
      overlay.addEventListener('pointerup', () => { dragStart = null; if (currentRect && currentRect.w > 12 && currentRect.h > 12) say('选区已就绪。确认后点击“添加选框中的题目”。'); else { currentRect = null; selection.style.display = 'none'; } });
      $('qadd').onclick = () => {
        if (!currentRect) { say('请先在页面上拖动鼠标框选题目。', true); return; }
        const x = Math.max(0, Math.floor(currentRect.x)), y = Math.max(0, Math.floor(currentRect.y));
        const w = Math.min(canvas.width - x, Math.ceil(currentRect.w)), h = Math.min(canvas.height - y, Math.ceil(currentRect.h));
        if (w <= 0 || h <= 0) return;
        const crop = document.createElement('canvas'); crop.width = w; crop.height = h; crop.getContext('2d').drawImage(canvas, x, y, w, h, 0, 0, w, h);
        items.push({ image: crop.toDataURL('image/png'), page: pageNo, source: fileName }); renderItems();
        selection.style.display = 'none'; currentRect = null; say(`已添加题目。当前共 ${items.length} 道，可调整顺序。`);
      };
      $('qclear').onclick = () => { items = []; renderItems(); say('已清空当前编排。'); };
      $('qsave').onclick = async () => {
        if (!items.length) { say('请先至少添加一道题。', true); return; }
        try {
          const name = `${fileName.replace(/\.pdf$/i, '')} 题目集`;
          const record = { id: crypto.randomUUID(), name, savedAt: Date.now(), items: structuredClone(items) };
          await new Promise((resolve, reject) => { const req = transaction('readwrite').put(record); req.onsuccess = resolve; req.onerror = () => reject(req.error); });
          await refreshSaved(); say(`已将 ${items.length} 道题保存到本机题库。`);
        } catch (err) { say('保存失败。浏览器可能已限制本机存储空间。', true); console.error(err); }
      };
      $('qexport').onclick = async () => {
        if (!items.length) { say('请先至少添加一道题。', true); return; }
        try {
          const out = await PDFDocument.create();
          for (const q of items) {
            const raw = atob(q.image.split(',')[1]), bytes = Uint8Array.from(raw, c => c.charCodeAt(0)), png = await out.embedPng(bytes);
            const page = out.addPage([595, 842]), scale = Math.min(555 / png.width, 780 / png.height);
            page.drawImage(png, { x: (595 - png.width * scale) / 2, y: (842 - png.height * scale) / 2, width: png.width * scale, height: png.height * scale });
          }
          const blob = new Blob([await out.save()], { type: 'application/pdf' }), url = URL.createObjectURL(blob), a = document.createElement('a');
          a.href = url; a.download = `${fileName.replace(/\.pdf$/i, '')}-题目编排.pdf`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); say('已下载按当前顺序编排的 PDF。');
        } catch (err) { say('生成 PDF 失败。', true); console.error(err); }
      };
      openDB().then(refreshSaved).catch(err => { say('本机题库不可用，请检查浏览器存储设置。', true); console.error(err); });
    })();
  </script>
</body>
</html>
